<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>

<body>
    <header class="cabecalho">
        <a href="#">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do sistema Bibliotec.">
        </a>

        <nav class="navegacao">
            <a href="../home/home.html">Home</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="login">
            <div class="login-cabecalho">
                <img src="../imgs/Icone - Bibliotec.png" alt="Logo Bibliotec">
                <h1>Bem-vindo(a) à Biblio Tec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>

            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" placeholder="*********">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg id="olho-aberto" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>

                            <svg id="olho-fechado" class="olho-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" >
                                <path
                                    d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                                <path
                                    d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                                <path d="m2 2 20 20" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>

                <button type="submit" class="botao-google">
                    <img src="../imgs/icone-google.svg" alt="Icone do google">
                    <span>Continuar com Google</span>
                </button>
            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
